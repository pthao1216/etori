fieldset a:hover {

/* --- Navigation Menu --- */

    background: white;

    font-size: 13px;
    transition: 0.3s;
}

.nav-links a:hover {
    background: #ff7671;
    transform: translateY(-2px);

.menu-icon {

    font-size: 26px;
    cursor: pointer;
    color: #de9393;
}

@media (max-width: 768px) {

    .nav-links {

        border-radius: 20px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);

    .nav-links.show { display: flex; }
    .nav-links a {
        color: #de9393 !important;
        background: white;
        border: 1px solid #ffb9b3;
    }
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}
