<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Image Gallery</title>

<style>
.img-gallery{
  width: 100%;
  height: 200px;
  object-fit: cover;   /* không méo ảnh */
  margin: 0;           /* không khoảng cách */
  padding: 0;
  border-radius: 0;    /* bỏ bo góc */
  display: block;      /* tránh gap inline */
}
</style>
</head>

<body>

<div class="container-fluid mt-4 p-0">
  <div class="row g-0">

    <!-- Hàng 1: full -->
    <div class="col-12">
      <img src="images/01.jpg" class="img-gallery">
    </div>

    <!-- Các ảnh còn lại -->
    <!-- mobile: 1 ảnh | sm: 2 ảnh | lg: 3 ảnh -->
    <div class="col-12 col-sm-6 col-lg-4">
      <img src="images/02.jpg" class="img-gallery">
    </div>

    <div class="col-12 col-sm-6 col-lg-4">
      <img src="images/03.jpg" class="img-gallery">
    </div>

    <div class="col-12 col-sm-6 col-lg-4">
      <img src="images/04.jpg" class="img-gallery">
    </div>

    <div class="col-12 col-sm-6 col-lg-4">
      <img src="images/05.jpg" class="img-gallery">
    </div>

    <div class="col-12 col-sm-6 col-lg-4">
      <img src="images/06.jpg" class="img-gallery">
    </div>

    <div class="col-12 col-sm-6 col-lg-4">
      <img src="images/07.jpg" class="img-gallery">
    </div>

  </div>
</div>

</body>
</html>
